name: Weekly Data Update

on:
  schedule:
    # Runs every Sunday at 00:00 UTC (Adjust time/day as needed)
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows manual trigger anytime from the Actions tab

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Grants permission to commit changes back to repo

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4

      - name: Run update script
        run: python update_product.py

      - name: Commit and push updated CSVs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tribes_india_products.csv amazon_flipkart_products.csv || git add *.csv || true
          git diff --staged --quiet || (git commit -m "Auto-update marketplace and store CSVs [skip ci]" && git push)
