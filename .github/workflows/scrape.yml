name: Automated Web Scraper & Repository Update

on:
  schedule:
    - cron: '0 0 * * 0' # Runs every Sunday at midnight
  workflow_dispatch:     # Allows manual trigger from GitHub UI

jobs:
  scrape-and-save:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Allows GitHub Actions to commit changes back to your repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper
        run: python scraper.py

      - name: Commit Updated CSV & Metadata back to Repository
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git commit -m "Automated dataset update: $(date -u +'%Y-%m-%d %H:%M UTC')" || exit 0
          git push
