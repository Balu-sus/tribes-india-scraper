name: Automated Web Scraper & Kaggle Sync

on:
  schedule:
    - cron: '0 0 * * 0' # Runs automatically every Sunday
  workflow_dispatch:     # Enables the manual "Run workflow" button in GitHub

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper
        run: python scraper.py

      - name: Commit Updated CSV back to GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git commit -m "Automated dataset update" || exit 0
          git push

      - name: Push Dataset to Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          kaggle datasets version -p ./data -m "Automated update via GitHub Actions" --dir-mode zip || kaggle datasets create -p ./data
